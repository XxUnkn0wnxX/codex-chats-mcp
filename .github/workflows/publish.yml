name: Publish to PyPI (disabled by default)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm this tested main commit should be published to PyPI
        required: true
        default: false
        type: boolean
      expected_version:
        description: Expected installed distribution version
        required: true
        type: string
      expected_name:
        description: Expected distribution name
        required: true
        default: codex-chats-mcp-v2
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Test and build the exact release commit
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PYPI_PUBLISH == 'true' &&
          inputs.confirm_publish == true }}
    uses: ./.github/workflows/test.yml
    with:
      expected_name: ${{ inputs.expected_name }}
      expected_version: ${{ inputs.expected_version }}
      release: true

  publish:
    name: Publish verified artifacts to PyPI
    needs: build
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PYPI_PUBLISH == 'true' &&
          inputs.confirm_publish == true &&
          needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/codex-chats-mcp-v2
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
