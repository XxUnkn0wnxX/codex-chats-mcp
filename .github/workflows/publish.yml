name: Publish to PyPI (disabled by default)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm this tested commit should be published to PyPI
        required: true
        default: false
        type: boolean
      expected_version:
        description: Expected installed distribution version
        required: true
        type: string
      expected_name:
        description: Expected distribution name
        required: true
        default: codex-chats-mcp
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    if: ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' && vars.ENABLE_PYPI_PUBLISH == 'true' && inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_NAME: ${{ inputs.expected_name }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Check wheel metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from email.parser import Parser
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              metadata_path = next(
                  path for path in wheel.namelist() if path.endswith(".dist-info/METADATA")
              )
              metadata = Parser().parsestr(wheel.read(metadata_path).decode())

          normalize = lambda value: re.sub(r"[-_.]+", "-", value).lower()
          assert normalize(metadata["Name"]) == normalize(os.environ["EXPECTED_NAME"])
          assert metadata["Version"] == os.environ["EXPECTED_VERSION"]
          print(f"Name: {metadata['Name']}\nVersion: {metadata['Version']}")
          PY
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$(mktemp -d)"
          test_cwd="$(mktemp -d)"
          trap 'rm -rf "$venv_dir" "$test_cwd"' EXIT
          python -m venv "$venv_dir"
          venv_python="$venv_dir/bin/python"
          "$venv_python" -m pip install "mcp[cli]==2.1.1"
          "$venv_python" -m pip install --no-deps dist/*.whl
          "$venv_python" -m pip check
          installed_version="$("$venv_python" -c 'import os; from importlib.metadata import version; print(version(os.environ["EXPECTED_NAME"]))')"
          test "$installed_version" = "$EXPECTED_VERSION"
          cd "$test_cwd"
          unset PYTHONPATH
          "$venv_python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' && vars.ENABLE_PYPI_PUBLISH == 'true' && inputs.confirm_publish == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/${{ inputs.expected_name }}
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
