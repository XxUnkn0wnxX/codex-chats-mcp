name: Publish to PyPI (disabled by default)

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm this tested main commit should be published to PyPI
        required: true
        default: false
        type: boolean
      expected_version:
        description: Expected installed distribution version
        required: true
        type: string
      expected_name:
        description: Expected distribution name
        required: true
        default: codex-chats-mcp-v2
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PYPI_PUBLISH == 'true' &&
          inputs.confirm_publish == true }}
    runs-on: ubuntu-latest
    env:
      EXPECTED_NAME: ${{ inputs.expected_name }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      CODEX_CHATS_DEBUG_LOG: "0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine packaging
      - name: Build sdist + wheel
        run: python -m build
      - name: Check distributions
        run: python -m twine check dist/*
      - name: Check release name and version in both distributions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tarfile
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          from packaging.utils import canonicalize_name
          from packaging.version import Version

          expected_name = canonicalize_name(os.environ["EXPECTED_NAME"])
          assert expected_name == "codex-chats-mcp-v2", expected_name
          expected_version = os.environ["EXPECTED_VERSION"]
          release = Version(expected_version)
          assert not (release.is_prerelease or release.is_devrelease or release.local), release

          dist_dir = Path("dist")
          wheels = list(dist_dir.glob("*.whl"))
          sdists = list(dist_dir.glob("*.tar.gz"))
          assert len(wheels) == 1, wheels
          assert len(sdists) == 1, sdists
          assert len(list(dist_dir.iterdir())) == 2, list(dist_dir.iterdir())
          with ZipFile(wheels[0]) as wheel:
              metadata_paths = [
                  path for path in wheel.namelist() if path.endswith(".dist-info/METADATA")
              ]
              assert len(metadata_paths) == 1, metadata_paths
              wheel_metadata = BytesParser().parsebytes(wheel.read(metadata_paths[0]))
          with tarfile.open(sdists[0], "r:gz") as sdist:
              metadata_paths = [
                  member for member in sdist.getmembers()
                  if len(Path(member.name).parts) == 2 and member.name.endswith("/PKG-INFO")
              ]
              assert len(metadata_paths) == 1, metadata_paths
              with sdist.extractfile(metadata_paths[0]) as metadata_file:
                  sdist_metadata = BytesParser().parsebytes(metadata_file.read())

          for label, metadata in (("wheel", wheel_metadata), ("sdist", sdist_metadata)):
              assert canonicalize_name(metadata["Name"]) == expected_name, metadata["Name"]
              assert metadata["Version"] == expected_version, metadata["Version"]
              print(f"{label}: {metadata['Name']} {metadata['Version']}")
          PY
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$(mktemp -d)"
          test_cwd="$(mktemp -d)"
          trap 'rm -rf "$venv_dir" "$test_cwd"' EXIT
          python -m venv "$venv_dir"
          venv_python="$venv_dir/bin/python"
          "$venv_python" -m pip install "mcp[cli]==2.1.1"
          "$venv_python" -m pip install --no-deps dist/*.whl
          "$venv_python" -m pip check
          installed_version="$("$venv_python" -c 'import os; from importlib.metadata import version; print(version(os.environ["EXPECTED_NAME"]))')"
          test "$installed_version" = "$EXPECTED_VERSION"
          cd "$test_cwd"
          unset PYTHONPATH
          "$venv_python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test*.py' -v
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          vars.ENABLE_PYPI_PUBLISH == 'true' &&
          inputs.confirm_publish == true }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/codex-chats-mcp-v2
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
