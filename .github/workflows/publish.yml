name: Publish to PyPI

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: Confirm the first PyPI upload (only while the project does not exist)
        required: true
        default: false
        type: boolean
      expected_version:
        description: Exact stable version for the first upload (from pyproject.toml)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  version:
    name: Check version increase or confirmed first upload
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.confirm_publish == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_publish: ${{ steps.gate.outputs.should_publish }}
      version: ${{ steps.gate.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install version parser
        run: python -m pip install packaging
      - name: Check immutable push versions or first-upload eligibility
        id: gate
        run: python .github/scripts/release_gate.py

  build:
    name: Test and build the exact release commit
    needs: version
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          needs.version.result == 'success' &&
          needs.version.outputs.should_publish == 'true' }}
    uses: ./.github/workflows/test.yml
    with:
      expected_name: codex-chats-mcp-v2
      expected_version: ${{ needs.version.outputs.version }}
      release: true

  publish:
    name: Publish verified artifacts to PyPI
    needs: [version, build]
    if: >-
      ${{ github.repository == 'XxUnkn0wnxX/codex-chats-mcp' &&
          github.ref == 'refs/heads/main' &&
          needs.version.result == 'success' &&
          needs.version.outputs.should_publish == 'true' &&
          needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/codex-chats-mcp-v2
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
