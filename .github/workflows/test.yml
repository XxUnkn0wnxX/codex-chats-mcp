name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CODEX_CHATS_DEBUG_LOG: "0"

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheel
        shell: bash
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .test-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            venv_python=".test-venv/Scripts/python.exe"
          else
            venv_python=".test-venv/bin/python"
          fi
          "$venv_python" -m pip install --upgrade pip
          "$venv_python" -m pip install "mcp[cli]==2.1.1"
          "$venv_python" -m pip install --no-deps dist/*.whl
          "$venv_python" -m pip check
          test_python="$PWD/$venv_python"
          tests_dir="$PWD/tests"
          test_dir="$PWD/.test-cwd"
          mkdir -p "$test_dir"
          trap 'rm -rf "$test_dir"' EXIT
          cd "$test_dir"
          unset PYTHONPATH
          "$test_python" -m unittest discover -s "$tests_dir" -v
