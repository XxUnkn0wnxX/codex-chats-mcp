name: Build packages

on:
  workflow_call:
    inputs:
      expected_name:
        type: string
        default: codex-chats-mcp-v2
      expected_version:
        type: string
        default: ""
      release:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build and verify release-mode artifacts
    # The caller's full test matrix must pass before this workflow is called.
    if: ${{ !inputs.release || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CODEX_CHATS_BUILD_DEBUG: "0"
      CODEX_CHATS_DEBUG_LOG: "0"
      EXPECTED_NAME: ${{ inputs.expected_name }}
      EXPECTED_VERSION: ${{ inputs.expected_version }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install packaging tools
        run: python -m pip install --upgrade build twine packaging pyyaml "setuptools>=77.0.3"
      - name: Test release gates and artifact validation guards
        run: python -m unittest discover -s .github/scripts -p 'test*.py' -v
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate exact artifact metadata and release stamps
        shell: bash
        run: |
          set -euo pipefail
          release_args=()
          if [[ "$RELEASE" == "true" ]]; then
            release_args+=(--release)
          fi
          python .github/scripts/check_distributions.py \
            --expected-name "$EXPECTED_NAME" \
            --expected-version "$EXPECTED_VERSION" \
            "${release_args[@]}"
          python -m twine check --strict dist/*
          sha256sum dist/* > "$RUNNER_TEMP/codex-chats-release.sha256"
      - name: Test final installed release wheel
        shell: bash
        run: |
          set -euo pipefail
          venv_dir="$RUNNER_TEMP/codex-chats-release-venv"
          test_cwd="$RUNNER_TEMP/codex-chats-release-cwd"
          python -m venv "$venv_dir"
          venv_python="$venv_dir/bin/python"
          "$venv_python" -m pip install dist/*.whl
          "$venv_python" -m pip check
          "$venv_python" -m pip list --format=freeze
          mkdir -p "$test_cwd"
          cd "$test_cwd"
          unset PYTHONPATH
          CODEX_CHATS_DEBUG_LOG=1 "$venv_python" - <<'PY'
          from pathlib import Path
          import codex_chats_mcp as server

          assert "site-packages" in Path(server.__file__).resolve().parts
          assert server.DEBUG_BUILD is False
          assert not server._debug_logging_enabled()
          assert server._resolve_error_log_path() is None
          PY
          "$venv_python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p 'test*.py' -v
      - name: Recheck artifacts after executable tests
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check "$RUNNER_TEMP/codex-chats-release.sha256"
          release_args=()
          if [[ "$RELEASE" == "true" ]]; then
            release_args+=(--release)
          fi
          python .github/scripts/check_distributions.py \
            --expected-name "$EXPECTED_NAME" \
            --expected-version "$EXPECTED_VERSION" \
            "${release_args[@]}"
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
