[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-chats-mcp-v2"
version = "0.2.0"
description = "MCP server to list, search, archive, rename, export, and delete ChatGPT conversations and Codex Cloud tasks."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ross Kuehl" }]
keywords = ["mcp", "model-context-protocol", "chatgpt", "codex", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp[cli]>=2.1.1,<3"]

[project.scripts]
codex-chats-mcp = "codex_chats_mcp:main"

[project.urls]
Homepage = "https://github.com/XxUnkn0wnxX/codex-chats-mcp"
Repository = "https://github.com/XxUnkn0wnxX/codex-chats-mcp"
Issues = "https://github.com/XxUnkn0wnxX/codex-chats-mcp/issues"
Upstream = "https://github.com/shoyu-ramen/codex-chats-mcp"

[tool.setuptools]
py-modules = ["_codex_chats_build", "codex_chats_mcp"]

[tool.setuptools.cmdclass]
build_py = "build_support.BuildPy"
editable_wheel = "build_support.EditableWheel"
sdist = "build_support.Sdist"
